<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>面试复盘 - Key管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;max-width:1200px;margin:0 auto;padding:24px;background:#f5f6f7;color:#333}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:22px}
.login-box{display:flex;gap:6px;align-items:center}
.login-box input{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:300px}
.login-box button{padding:8px 16px;background:#6c5ce7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;color:#555;margin-bottom:4px}
input,select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-bottom:10px}
.btn{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:#6c5ce7;color:#fff;width:100%}.btn-primary:hover{background:#5a4bd1}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:4px;margin:0 2px}
.btn-renew{background:#e8f5e9;color:#07c160;border:1px solid #07c160;cursor:pointer}.btn-renew:hover{background:#07c160;color:#fff}.btn-del{background:#fde8e8;color:#e74c3c;border:1px solid #e74c3c;cursor:pointer;padding:4px 8px;font-size:11px;border-radius:4px}.btn-del:hover{background:#e74c3c;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 6px;border-bottom:2px solid #eee;color:#999;font-weight:600;font-size:11px}
td{padding:8px 6px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.progress-bar{height:5px;background:#eee;border-radius:3px;overflow:hidden;min-width:60px}
.progress-fill{height:100%;border-radius:3px}.low{background:#07c160}.mid{background:#f39c12}.high{background:#e74c3c}
.badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.badge-ok{background:#e8f5e9;color:#07c160}.badge-warn{background:#fff3e0;color:#e67e22}.badge-end{background:#fde8e8;color:#e74c3c}
.result-box{padding:12px;background:#ecfdf3;border:1px solid #07c160;border-radius:8px;margin-top:10px;display:none}
.key-display{font-family:monospace;font-weight:700;background:#e5f5e9;padding:6px 10px;border-radius:4px;word-break:break-all;margin:6px 0;font-size:13px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:99;display:none}
.toast-ok{background:#07c160}.toast-err{background:#e74c3c}
textarea{width:100%;height:150px;font-family:monospace;font-size:12px;padding:8px;border:1px solid #ddd;border-radius:4px;margin-top:8px}
small{color:#999}
</style>
</head>
<body>

<div class="topbar">
  <h1>🔑 Key 管理</h1>
  <div id="loginArea" class="login-box">
    
    <input id="adminKey" type="password" placeholder="输入管理员密钥 (百炼Key)" />
    <button onclick="login()">登录</button>
  </div>
  <div id="loggedInArea" style="display:none">
    <span style="color:#07c160;font-weight:600">✅ 已登录</span>
    <button class="btn btn-sm" onclick="logout()" style="margin-left:8px">退出</button>
  </div>
</div>

<div id="main" style="display:none">
  <div class="grid">
    <div>
      <div class="card">
        <h2>🎫 生成 Key</h2>
        <label>标签</label><input id="label" placeholder="如: 张三-年卡">
        <label>配额</label><input id="quota" type="number" value="100" min="1">
        <button class="btn btn-primary" onclick="gen()">生成</button>
        <div id="genResult" class="result-box"></div>
      </div>
      <div class="card" style="margin-top:12px">
        <h2>📦 批量生成</h2>
        <label>数量</label><input id="batchCount" type="number" value="10" min="1" max="50">
        <label>每个配额</label><input id="batchQuota" type="number" value="100">
        <label>标签前缀</label><input id="batchLabel" placeholder="小红书-月卡">
        <button class="btn btn-renew" onclick="batchGen()" style="width:100%">批量生成</button>
        <div id="batchResult" class="result-box"></div>
      </div>
    </div>
    <div class="card">
      <h2>👥 客户列表 <span id="keyCount" style="font-size:12px;color:#999;font-weight:400"></span></h2>
      <input id="search" placeholder="🔍 搜索 Key 或标签..." oninput="render()" style="padding:6px 10px;font-size:12px;margin-bottom:10px;width:100%;border:1px solid #ddd;border-radius:6px">
      <div style="max-height:65vh;overflow-y:auto">
        <table><thead><tr><th>Key</th><th>标签</th><th>用量</th><th>进度</th><th>状态</th><th>续费</th></tr></thead><tbody id="tbody"></tbody></table>
      </div>
      <button class="btn btn-sm" onclick="load()" style="margin-top:10px">🔄 刷新</button>
<button class="btn btn-sm" onclick="purgeAll()" style="margin-top:10px;margin-left:8px;background:#e74c3c;color:#fff;border:none">🗑️ 清空全部</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = "/api-proxy";
let AK = "";
let keys = [];

// 从 localStorage 恢复
if (localStorage.getItem("ir_ak")) {
  AK = localStorage.getItem("ir_ak");
  document.getElementById("adminKey").value = AK;
  login();
}

function toast(msg, ok) {
  const e = document.getElementById("toast");
  e.textContent = msg;
  e.className = "toast " + (ok ? "toast-ok" : "toast-err");
  e.style.display = "block";
  setTimeout(() => e.style.display = "none", 2000);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers["x-admin-key"] = AK;
  const r = await fetch(API + path, opts);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

async function login() {
  AK = document.getElementById("adminKey").value.trim();
  if (!AK) return toast("请输入管理员密钥");
  try {
    await api("/admin/list-keys");
    localStorage.setItem("ir_ak", AK);
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("loggedInArea").style.display = "";
    document.getElementById("main").style.display = "";
    await load();
  } catch (e) {
    toast(e.message);
  }
}

function logout() {
  AK = "";
  keys = [];
  localStorage.removeItem("ir_ak");
  document.getElementById("loginArea").style.display = "";
  document.getElementById("loggedInArea").style.display = "none";
  document.getElementById("main").style.display = "none";
}

async function load() {
  try {
    keys = await api("/admin/list-keys");
    render();
    toast("已刷新", true);
  } catch (e) {
    toast(e.message);
  }
}

async function gen() {
  const label = document.getElementById("label").value || "未备注";
  const quota = parseInt(document.getElementById("quota").value) || 100;
  try {
    const d = await api("/admin/generate-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label, quota }),
    });
    document.getElementById("genResult").style.display = "block";
    document.getElementById("genResult").innerHTML =
      `<div style="font-weight:700;color:#07c160;margin-bottom:6px">✅ Key 已生成</div>
       <div class="key-display">${d.key}</div>
       <small>标签: ${d.label} | 配额: ${d.quota} 次 | 剩余: ${d.remaining ?? d.quota} 次</small>
       <br><small>请立即复制！关闭后无法找回</small>`;
    await load();
  } catch (e) {
    toast(e.message);
  }
}

async function batchGen() {
  const n = parseInt(document.getElementById("batchCount").value) || 10;
  const q = parseInt(document.getElementById("batchQuota").value) || 100;
  const lb = document.getElementById("batchLabel").value || "批量";
  const ks = [];
  try {
    for (let i = 0; i < n; i++) {
      const d = await api("/admin/generate-key", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label: lb + "-" + (i + 1), quota: q }),
      });
      ks.push(d.key);
    }
    document.getElementById("batchResult").style.display = "block";
    document.getElementById("batchResult").innerHTML =
      `<div style="font-weight:700;color:#07c160;margin-bottom:6px">✅ ${n} 个 Key 已生成</div>
       <small>标签前缀: ${lb} | 每个配额: ${q} 次</small>
       <textarea onclick="this.select()">${ks.join("\n")}</textarea>
       <small>点击文本框全选复制</small>`;
    await load();
  } catch (e) {
    toast(e.message);
  }
}

function render() {
  const s = (document.getElementById("search").value || "").toLowerCase();
  const f = keys.filter(k =>
    (k.label || "").toLowerCase().includes(s) ||
    (k.key || "").toLowerCase().includes(s)
  );
  document.getElementById("keyCount").textContent = `(共 ${f.length} 个)`;
  document.getElementById("tbody").innerHTML = f.map(k => {
    const pct = k.quota > 0 ? Math.round(k.used / k.quota * 100) : 0;
    let cls = "low", badge = "badge-ok", st = "正常";
    if (k.used >= k.quota) { cls = "high"; badge = "badge-end"; st = "用完"; }
    else if (pct > 80) { cls = "mid"; badge = "badge-warn"; st = "快用完"; }
    return `<tr>
      <td style="font-family:monospace;font-size:11px;word-break:break-all;max-width:280px">${k.key}</td>
      <td>${k.label || "-"}</td>
      <td style="font-size:12px">${k.used}/${k.quota}</td>
      <td><div class="progress-bar"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div></td>
      <td><span class="badge ${badge}">${st}</span></td>
      <td>
        <input class="renew-input" id="amt_${k.key.substring(0,8)}" type="number" value="100" min="1" style="width:50px;padding:2px 4px;font-size:11px;border:1px solid #ddd;border-radius:3px">
        <button class="btn btn-sm btn-renew" onclick="renew('${k.key}',document.getElementById('amt_${k.key.substring(0,8)}').value)">续</button>
        <button class="btn btn-sm btn-del" onclick="deleteKey('${k.key}')">✕</button>
        <button class="btn btn-sm" onclick="editKey('${k.key}','${(k.label||'')}')" style="background:#fff3e0;color:#e67e22;border:1px solid #e67e22;cursor:pointer;font-size:11px;border-radius:4px;padding:2px 6px">✎</button>
      </td>
    </tr>`;
  }).join("");
}

async function editKey(k, oldLabel) {
  const lb = prompt("新标签（取消=不修改）：", oldLabel);
  if (lb === null) return;
  const qt = prompt("新配额（取消=不修改）：", "");
  try {
    const body = { key: k };
    if (lb !== oldLabel) body.label = lb;
    if (qt !== null && qt !== "") body.quota = parseInt(qt);
    await api("/admin/edit-key", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    toast("已更新", true);
    await load();
  } catch (e) { toast(e.message); }
}

async function deleteKey(k) {
  if (!confirm("确定删除 Key: " + k.substring(0,16) + "...？")) return;
  try {
    await api("/admin/delete-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: k }),
    });
    toast("已删除", true);
    await load();
  } catch (e) { toast(e.message); }
}

async function purgeAll() {
  if (!confirm("⚠️ 确定清空全部 Key？此操作不可恢复！")) return;
  try {
    await api("/admin/purge", { method: "POST" });
    toast("已清空全部", true);
    await load();
  } catch (e) { toast(e.message); }
}

async function renew(k, add) {
  try {
    await api("/admin/renew-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: k, addQuota: add }),
    });
    toast(`已续费 +${add}`, true);
    await load();
  } catch (e) {
    toast(e.message);
  }
}
</script>
</body>
</html>
